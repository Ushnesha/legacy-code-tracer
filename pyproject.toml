[project]
name = "aerotrace"
version = "0.1.0"
description = "Legacy code understanding tool: call graph, data-access graph and plain-English explanations."
requires-python = ">=3.11"
dependencies = [
    "libclang",
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "anthropic",
    "pytest",
    "pyyaml>=6.0.3",
    "openai>=3.24.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
